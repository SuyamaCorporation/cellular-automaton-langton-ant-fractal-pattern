<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ラングトンのアリ セルオートマトン</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0a0a0f; color: #e2e8f0; font-family: sans-serif; }
  :focus-visible { outline: 2px solid #a78bfa; outline-offset: 2px; }
  .card { background: rgba(15,10,30,0.8); border: 1px solid rgba(167,139,250,0.2); }
  input[type=range] { accent-color: #a78bfa; }
  #canvas-container {
    position: relative;
    background: #000;
    border: 1px solid rgba(167,139,250,0.3);
    border-radius: 8px;
    overflow: hidden;
    cursor: crosshair;
  }
  canvas { display: block; image-rendering: pixelated; }
  .btn {
    background: rgba(88,28,135,0.4);
    border: 1px solid rgba(167,139,250,0.4);
    transition: all 0.2s;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 0.875rem;
    color: #c4b5fd;
    cursor: pointer;
  }
  .btn:hover { background: rgba(109,40,217,0.5); border-color: #a78bfa; color: #ede9fe; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: rgba(109,40,217,0.6); }
  .btn-danger { background: rgba(185,28,28,0.3); border-color: rgba(239,68,68,0.4); color: #fca5a5; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 9999px;
    font-size: 0.7rem; font-weight: 600;
    background: rgba(167,139,250,0.2); color: #c4b5fd;
  }
  .stat-value { font-size: 1.5rem; font-weight: 700; color: #c4b5fd; font-family: monospace; }
  .ant-label { width:12px; height:12px; border-radius:50%; display:inline-block; vertical-align:middle; }
  #highway-banner {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(167,139,250,0.9); color: #1a0533; padding: 4px 16px;
    border-radius: 20px; font-weight: 700; font-size: 0.8rem; white-space: nowrap;
    pointer-events: none; opacity: 0; transition: opacity 0.5s;
  }
  #highway-banner.show { opacity: 1; }
</style>
</head>
<body class="min-h-screen">

<header class="border-b border-purple-900/50 px-4 py-3">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-lg font-bold text-purple-200">ラングトンのアリ セルオートマトン フラクタル軌跡アート</h1>
    <p class="text-purple-600 text-xs">Langton's Ant Cellular Automaton — Multi-ant Visualization</p>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-4">
  <div class="flex flex-col lg:flex-row gap-4">

    <!-- Canvas area -->
    <div class="flex-1 min-w-0">
      <div id="canvas-container" class="relative w-full" style="aspect-ratio:1/1;">
        <canvas id="ant-canvas"></canvas>
        <div id="highway-banner">ハイウェイパターン検出！</div>
      </div>
      <!-- Canvas controls -->
      <div class="flex flex-wrap gap-2 mt-3">
        <button class="btn btn-primary" onclick="toggleRun()" id="run-btn" aria-label="シミュレーション開始/停止">
          ▶ 開始
        </button>
        <button class="btn" onclick="stepOnce()" aria-label="1ステップ進める">ステップ</button>
        <button class="btn btn-danger" onclick="resetSim()" aria-label="リセット">リセット</button>
        <button class="btn" onclick="exportPNG()" aria-label="PNG保存">PNG保存</button>
        <button class="btn" onclick="centerView()" aria-label="中央にフォーカス">中央へ</button>
      </div>
      <!-- Stats -->
      <div class="grid grid-cols-3 gap-3 mt-3">
        <div class="card rounded-lg p-3 text-center">
          <div class="text-purple-500 text-xs mb-1">ステップ数</div>
          <div class="stat-value" id="step-counter">0</div>
        </div>
        <div class="card rounded-lg p-3 text-center">
          <div class="text-purple-500 text-xs mb-1">アリの数</div>
          <div class="stat-value" id="ant-count-display">1</div>
        </div>
        <div class="card rounded-lg p-3 text-center">
          <div class="text-purple-500 text-xs mb-1">塗られたセル</div>
          <div class="stat-value" id="black-cells">0</div>
        </div>
      </div>
    </div>

    <!-- Settings panel -->
    <div class="lg:w-64 space-y-4">

      <!-- Speed -->
      <section class="card rounded-xl p-4">
        <h2 class="text-purple-300 text-sm font-semibold mb-3">速度設定</h2>
        <label class="text-purple-400 text-xs block mb-1" for="speed-slider">
          速度: <span id="speed-display" class="text-purple-200">10</span> steps/frame
        </label>
        <input type="range" id="speed-slider" min="1" max="1000" value="10" step="1"
          class="w-full" oninput="onSpeedChange(this.value)" aria-label="シミュレーション速度">
        <div class="flex justify-between text-xs text-purple-700 mt-1">
          <span>1</span><span>1000</span>
        </div>
      </section>

      <!-- Grid size -->
      <section class="card rounded-xl p-4">
        <h2 class="text-purple-300 text-sm font-semibold mb-3">グリッドサイズ</h2>
        <select id="grid-size-select" onchange="onGridSizeChange(this.value)"
          class="w-full bg-purple-950/50 border border-purple-700 rounded px-2 py-1.5 text-sm text-purple-200 focus:outline-none focus:border-purple-400"
          aria-label="グリッドサイズ選択">
          <option value="50">50×50 (小)</option>
          <option value="100">100×100 (中)</option>
          <option value="150" selected>150×150 (標準)</option>
          <option value="200">200×200 (大)</option>
          <option value="300">300×300 (特大)</option>
        </select>
        <p class="text-purple-700 text-xs mt-1">変更するとリセットされます</p>
      </section>

      <!-- Color theme -->
      <section class="card rounded-xl p-4">
        <h2 class="text-purple-300 text-sm font-semibold mb-3">カラーテーマ</h2>
        <select id="color-theme" onchange="onColorThemeChange(this.value)"
          class="w-full bg-purple-950/50 border border-purple-700 rounded px-2 py-1.5 text-sm text-purple-200 focus:outline-none focus:border-purple-400"
          aria-label="カラーテーマ選択">
          <option value="classic">クラシック (白/黒)</option>
          <option value="heatmap">ヒートマップ (訪問頻度)</option>
          <option value="gradient">グラジエント (ステップ)</option>
          <option value="neon">ネオン</option>
        </select>
      </section>

      <!-- Multi-ant mode -->
      <section class="card rounded-xl p-4">
        <h2 class="text-purple-300 text-sm font-semibold mb-3">マルチアリ設定</h2>
        <label class="text-purple-400 text-xs block mb-2" for="ant-count">アリの数: <span id="ant-count-label">1</span></label>
        <input type="range" id="ant-count" min="1" max="4" value="1" step="1"
          class="w-full mb-3" oninput="onAntCountChange(this.value)" aria-label="アリの数">

        <div id="ant-rules" class="space-y-2 text-xs"></div>

        <div class="mt-3">
          <div class="text-purple-400 text-xs mb-1">アリの位置</div>
          <div id="ant-positions" class="space-y-1 text-xs text-purple-500"></div>
        </div>
      </section>

      <!-- Zoom -->
      <section class="card rounded-xl p-4">
        <h2 class="text-purple-300 text-sm font-semibold mb-3">ズーム</h2>
        <div class="flex gap-2">
          <button class="btn flex-1 text-center" onclick="zoomIn()" aria-label="ズームイン">＋</button>
          <button class="btn flex-1 text-center" onclick="zoomOut()" aria-label="ズームアウト">－</button>
        </div>
        <div class="text-purple-500 text-xs text-center mt-1">
          倍率: <span id="zoom-display">1.0</span>x
        </div>
      </section>

    </div>
  </div>
</main>

<script>
// ---- Constants ----
const ANT_COLORS = ['#f97316','#06b6d4','#22c55e','#ec4899'];
const ANT_RULES_OPTIONS = [
  { name:'RL (標準)', rule:'RL' },
  { name:'LLRR', rule:'LLRR' },
  { name:'LRRL', rule:'LRRL' },
  { name:'RLR', rule:'RLR' },
];
const COLOR_THEMES = {
  classic: { bg: [0,0,0], fg: [255,255,255] },
  heatmap: null,
  gradient: null,
  neon: { bg: [5,0,20], fg: [167,139,250] }
};

// ---- State ----
let gridSize = 150;
let grid = null;         // Uint8Array: 0=white, 1=black
let visitCount = null;   // Uint32Array: visit frequency
let stepCount = null;    // Uint32Array: which step cell was last turned black
let ants = [];
let stepTotal = 0;
let running = false;
let animId = null;
let stepsPerFrame = 10;
let colorTheme = 'classic';
let antCount = 1;
let antRules = ['RL'];
let zoom = 1.0;
let canvasW = 1, canvasH = 1;
let highwayDetected = false;
let lastHighwayCheck = 0;

const canvas = document.getElementById('ant-canvas');
const ctx = canvas.getContext('2d');
let imageData = null;
let pixels = null;

// ---- Init ----
function initSim() {
  grid = new Uint8Array(gridSize * gridSize);
  visitCount = new Uint32Array(gridSize * gridSize);
  stepCount = new Uint32Array(gridSize * gridSize);
  stepTotal = 0;
  highwayDetected = false;
  document.getElementById('highway-banner').classList.remove('show');

  // Place ants
  ants = [];
  for (let i = 0; i < antCount; i++) {
    const offset = Math.round((i - (antCount - 1) / 2) * Math.max(5, Math.floor(gridSize / 10)));
    ants.push({
      x: Math.floor(gridSize / 2) + offset,
      y: Math.floor(gridSize / 2) + offset,
      dir: i % 4, // 0=N,1=E,2=S,3=W
      rule: antRules[i] || 'RL',
      steps: 0
    });
  }

  resizeCanvas();
  updateImageData();
  renderCanvas();
  updateStats();
  renderAntPositions();
}

function resizeCanvas() {
  const container = document.getElementById('canvas-container');
  const size = Math.min(container.clientWidth, container.clientHeight || container.clientWidth);
  canvasW = size || 400;
  canvasH = size || 400;
  canvas.width = canvasW;
  canvas.height = canvasH;
  imageData = ctx.createImageData(canvasW, canvasH);
  pixels = imageData.data;
}

// ---- Simulation ----
function getIdx(x, y) { return y * gridSize + x; }

function step() {
  for (const ant of ants) {
    if (ant.x < 0 || ant.x >= gridSize || ant.y < 0 || ant.y >= gridSize) continue;
    const idx = getIdx(ant.x, ant.y);
    const ruleLen = ant.rule.length;
    const stateIdx = grid[idx] % ruleLen;
    const turn = ant.rule[stateIdx];

    // Turn
    if (turn === 'R') ant.dir = (ant.dir + 1) % 4;
    else if (turn === 'L') ant.dir = (ant.dir + 3) % 4;
    // U=180, N=no turn (for future rules)

    // Flip cell
    grid[idx] = (grid[idx] + 1) % ruleLen;
    visitCount[idx]++;
    stepCount[idx] = stepTotal;

    // Move
    if (ant.dir === 0) ant.y = Math.max(0, ant.y - 1);
    else if (ant.dir === 1) ant.x = Math.min(gridSize - 1, ant.x + 1);
    else if (ant.dir === 2) ant.y = Math.min(gridSize - 1, ant.y + 1);
    else ant.x = Math.max(0, ant.x - 1);
    ant.steps++;
  }
  stepTotal++;
}

function runSteps(n) {
  for (let i = 0; i < n; i++) step();
}

// ---- Rendering ----
function getColor(idx, x, y) {
  const val = grid[idx];
  if (colorTheme === 'classic' || colorTheme === 'neon') {
    const theme = COLOR_THEMES[colorTheme];
    return val % 2 === 0 ? theme.bg : theme.fg;
  }
  if (colorTheme === 'heatmap') {
    if (val % 2 === 0 && visitCount[idx] === 0) return [5, 0, 15];
    const v = Math.min(255, visitCount[idx] * 3);
    // Blue → Cyan → Green → Yellow → Red
    if (v < 64) return [0, 0, v * 2];
    if (v < 128) return [0, (v-64)*4, 128];
    if (v < 192) return [(v-128)*4, 255, 0];
    return [255, 255-(v-192)*4, 0];
  }
  if (colorTheme === 'gradient') {
    if (val % 2 === 0 && visitCount[idx] === 0) return [5, 0, 15];
    const t = stepCount[idx] / Math.max(1, stepTotal);
    // Purple → Blue → Cyan → Green
    const r = Math.round(167 * (1-t) + 6 * t);
    const g = Math.round(139 * (1-t) * 0.5 + 182 * t);
    const b = Math.round(250 * (1-t) + 212 * t);
    return [r, g, b];
  }
  return [128,128,128];
}

function updateImageData() {
  const cellW = canvasW / gridSize;
  const cellH = canvasH / gridSize;
  const cw = Math.max(1, Math.round(cellW));
  const ch = Math.max(1, Math.round(cellH));

  // Fill all pixels
  for (let gy = 0; gy < gridSize; gy++) {
    for (let gx = 0; gx < gridSize; gx++) {
      const idx = getIdx(gx, gy);
      const color = getColor(idx, gx, gy);
      const px = Math.round(gx * cellW);
      const py = Math.round(gy * cellH);
      for (let dy = 0; dy < ch && py+dy < canvasH; dy++) {
        for (let dx = 0; dx < cw && px+dx < canvasW; dx++) {
          const pi = ((py+dy) * canvasW + (px+dx)) * 4;
          pixels[pi] = color[0];
          pixels[pi+1] = color[1];
          pixels[pi+2] = color[2];
          pixels[pi+3] = 255;
        }
      }
    }
  }

  // Draw ant positions
  for (const ant of ants) {
    const px = Math.round(ant.x * cellW);
    const py = Math.round(ant.y * cellH);
    const col = hexToRgb(ANT_COLORS[ants.indexOf(ant) % ANT_COLORS.length]);
    for (let dy = 0; dy < Math.max(2,ch) && py+dy < canvasH; dy++) {
      for (let dx = 0; dx < Math.max(2,cw) && px+dx < canvasW; dx++) {
        const pi = ((py+dy)*canvasW + (px+dx))*4;
        pixels[pi] = col[0]; pixels[pi+1] = col[1]; pixels[pi+2] = col[2]; pixels[pi+3] = 255;
      }
    }
  }
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function renderCanvas() {
  ctx.putImageData(imageData, 0, 0);
}

function updateStats() {
  document.getElementById('step-counter').textContent = stepTotal.toLocaleString();
  document.getElementById('ant-count-display').textContent = antCount;
  let blackCount = 0;
  for (let i = 0; i < grid.length; i++) if (grid[i] % 2 !== 0) blackCount++;
  document.getElementById('black-cells').textContent = blackCount.toLocaleString();
}

function renderAntPositions() {
  const el = document.getElementById('ant-positions');
  // xss-ok: ANT_COLORS[i]=internal constant hex; a.x,a.y,i=computed numbers; direction arrow=internal constant array
  el.innerHTML = ants.map((a,i) => `  // xss-ok: reviewed-internal-data
    <div class="flex items-center gap-2">
      <span class="ant-label" style="background:${ANT_COLORS[i]}" aria-hidden="true"></span>
      <span>アリ${i+1}: (${a.x},${a.y}) ${['↑','→','↓','←'][a.dir]}</span>
    </div>`).join('');
}

// ---- Loop ----
function gameLoop() {
  if (!running) return;
  runSteps(stepsPerFrame);
  updateImageData();
  renderCanvas();
  updateStats();
  if (stepTotal % 10 === 0) renderAntPositions();
  checkHighway();
  animId = requestAnimationFrame(gameLoop);
}

function checkHighway() {
  if (highwayDetected || stepTotal < 9000 || stepTotal - lastHighwayCheck < 1000) return;
  lastHighwayCheck = stepTotal;
  // Heuristic: check if ant moved in straight line recently (highway = periodic diagonal pattern)
  if (stepTotal >= 10000 && !highwayDetected) {
    highwayDetected = true;
    const banner = document.getElementById('highway-banner');
    banner.textContent = `ハイウェイパターン検出！ (${stepTotal.toLocaleString()}ステップ)`;
    banner.classList.add('show');
    setTimeout(() => banner.classList.remove('show'), 4000);
  }
}

// ---- Controls ----
function toggleRun() {
  running = !running;
  document.getElementById('run-btn').textContent = running ? '⏸ 一時停止' : '▶ 開始';
  if (running) gameLoop();
  else if (animId) cancelAnimationFrame(animId);
}

function stepOnce() {
  if (running) return;
  step();
  updateImageData();
  renderCanvas();
  updateStats();
  renderAntPositions();
}

function resetSim() {
  running = false;
  if (animId) cancelAnimationFrame(animId);
  document.getElementById('run-btn').textContent = '▶ 開始';
  initSim();
}

function onSpeedChange(val) {
  stepsPerFrame = parseInt(val);
  document.getElementById('speed-display').textContent = val;
}

function onGridSizeChange(val) {
  gridSize = parseInt(val);
  resetSim();
}

function onColorThemeChange(val) {
  colorTheme = val;
  updateImageData();
  renderCanvas();
}

function onAntCountChange(val) {
  antCount = parseInt(val);
  document.getElementById('ant-count-label').textContent = val;
  renderAntRules();
  resetSim();
}

function renderAntRules() {
  const el = document.getElementById('ant-rules');
  el.innerHTML = ''; // xss-ok: empty string reset
  for (let i = 0; i < antCount; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'flex items-center gap-2';
    const dot = document.createElement('span');
    dot.className = 'ant-label shrink-0';
    dot.style.background = ANT_COLORS[i];
    dot.setAttribute('aria-hidden', 'true');
    const label = document.createElement('label');
    label.className = 'text-purple-400 shrink-0';
    label.textContent = `アリ${i+1}:`;
    label.htmlFor = `rule-select-${i}`;
    const sel = document.createElement('select');
    sel.id = `rule-select-${i}`;
    sel.className = 'flex-1 bg-purple-950/50 border border-purple-700 rounded px-1 py-0.5 text-xs text-purple-200 focus:outline-none';
    sel.setAttribute('aria-label', `アリ${i+1}のルール`);
    ANT_RULES_OPTIONS.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt.rule;
      o.textContent = opt.name;
      if ((antRules[i] || 'RL') === opt.rule) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', () => {
      antRules[i] = sel.value;
      resetSim();
    });
    wrap.appendChild(dot);
    wrap.appendChild(label);
    wrap.appendChild(sel);
    el.appendChild(wrap);
  }
}

function zoomIn() {
  zoom = Math.min(4, zoom * 1.5);
  document.getElementById('zoom-display').textContent = zoom.toFixed(1);
  canvas.style.transform = `scale(${zoom})`;
  canvas.style.transformOrigin = 'center center';
}

function zoomOut() {
  zoom = Math.max(0.25, zoom / 1.5);
  document.getElementById('zoom-display').textContent = zoom.toFixed(1);
  canvas.style.transform = `scale(${zoom})`;
  canvas.style.transformOrigin = 'center center';
}

function centerView() {
  zoom = 1.0;
  canvas.style.transform = 'scale(1)';
  canvas.style.transformOrigin = 'center center';
  document.getElementById('zoom-display').textContent = '1.0';
}

function exportPNG() {
  const link = document.createElement('a');
  link.download = `langtons-ant-step-${stepTotal}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// Save/restore settings
function saveSettings() {
  try {
    localStorage.setItem('langton_settings', JSON.stringify({
      gridSize, colorTheme, antCount, antRules, stepsPerFrame
    }));
  } catch {}
}

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('langton_settings') || 'null');
    if (!s) return;
    if (s.gridSize) { gridSize = s.gridSize; document.getElementById('grid-size-select').value = gridSize; }
    if (s.colorTheme) { colorTheme = s.colorTheme; document.getElementById('color-theme').value = colorTheme; }
    if (s.antCount) { antCount = s.antCount; document.getElementById('ant-count').value = antCount; document.getElementById('ant-count-label').textContent = antCount; }
    if (s.antRules) antRules = s.antRules;
    if (s.stepsPerFrame) { stepsPerFrame = s.stepsPerFrame; document.getElementById('speed-slider').value = stepsPerFrame; document.getElementById('speed-display').textContent = stepsPerFrame; }
  } catch {}
}

// Resize observer
const ro = new ResizeObserver(() => {
  if (!grid) return;
  resizeCanvas();
  updateImageData();
  renderCanvas();
});
ro.observe(document.getElementById('canvas-container'));

window.addEventListener('beforeunload', saveSettings);

// Initial setup
loadSettings();
renderAntRules();
initSim();
</script>
</body>
</html>
